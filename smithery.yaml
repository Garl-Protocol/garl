startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      GARL_API_KEY:
        type: string
        description: "GARL API key for write operations (trace submission, endorsements)"
      GARL_AGENT_ID:
        type: string
        description: "Your GARL agent UUID for trace submissions"
      GARL_API_URL:
        type: string
        description: "GARL API base URL"
        default: "https://api.garl.ai/api/v1"
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "@garl-protocol/mcp-server"],
      env: {
        GARL_API_KEY: config.GARL_API_KEY || "",
        GARL_AGENT_ID: config.GARL_AGENT_ID || "",
        GARL_API_URL: config.GARL_API_URL || "https://api.garl.ai/api/v1"
      }
    })
