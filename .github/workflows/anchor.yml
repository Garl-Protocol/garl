name: Weekly Merkle Anchor

# Rolls up unanchored Action Receipts into a Merkle batch and anchors the root
# on Base mainnet. Per-anchor cost is ~$0.01 and independent of batch size, so
# a weekly cadence keeps on-chain cost trivial while bounding receipt latency.
#
# Requires repo secrets (Settings -> Secrets -> Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY  - DB access
#   DEPLOYER_PRIVATE_KEY                     - MerkleAnchor owner key
#   BASE_RPC_URL                             - Base mainnet RPC (optional)
# Missing secrets FAIL the job and open/update a "weekly anchor failed" issue —
# a silent no-op here would break the living-anchor-chain guarantee that
# /anchors and the README advertise. Setup runbook: docs/runbooks/anchoring.md

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch: {}

concurrency:
  group: merkle-anchor
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  anchor:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'Garl-Protocol/garl' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Install Foundry (cast)
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1
      - name: Anchor pending batch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          GARL_MERKLE_ANCHOR_CONTRACT: "0xBeD7EdeFbEb02be9682bCdeC5fb5D7DA28b1b6F2"
          GARL_MERKLE_ANCHOR_CHAIN_ID: "8453"
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL || 'https://mainnet.base.org' }}
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ] && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ -z "$DEPLOYER_PRIVATE_KEY" ] && missing="$missing DEPLOYER_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Anchor secrets not configured:$missing — the weekly anchor DID NOT run. See docs/runbooks/anchoring.md"
            exit 1
          fi
          python scripts/anchor_batch.py
      - name: Alert on failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Weekly Merkle anchor FAILED"
          body="The weekly anchor run failed — no batch was anchored on Base. Fix before the anchor chain gap grows.

          Run: $RUN_URL
          Runbook: docs/runbooks/anchoring.md"
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --label anchor-failure --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label anchor-failure || \
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
