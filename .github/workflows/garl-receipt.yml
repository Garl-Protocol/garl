name: GARL Receipt
# Dogfood: signs every AI-authored commit in this repo with a cryptographic
# receipt. Fires on direct pushes to main (the working flow — no PRs) and on
# PRs (if any are opened). The action handles both event types. Only secrets.*
# contexts are used; no untrusted input is interpolated into shell commands.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sign-ai-commits:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'Garl-Protocol/garl' }}
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: GARL Receipt
        uses: Garl-Protocol/garl-receipt-action@6948921772c8dc0c9b352742da07f49ec784c72b # v1.2.0
        with:
          garl-api-key: ${{ secrets.GARL_API_KEY }}
          # garl-agent-id omitted on purpose — dogfoods the v1.2.0 one-secret
          # flow: the action resolves the agent id from the API key.
