name: Daily Session Scan

# Runs the session-level behavioral scan (backend/app/services/session_anomaly.py)
# over every agent active in the last 24h: spend velocity vs capability budget,
# delegation-chain depth, novel irreversible targets, receipt-rate bursts.
# Alerts are signed envelopes persisted to session_alerts and delivered via the
# per-agent "anomaly" webhooks. Dedupe (6h per agent+rule) makes re-runs safe.
#
# Requires repo secrets (Settings -> Secrets -> Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY  - DB access
#   SIGNING_PRIVATE_KEY_HEX                  - production receipt signing key
#     NOTE: SIGNING_PRIVATE_KEY_HEX is NOT yet configured as a repo secret.
#     Missing secrets FAIL the job loudly (same policy as anchor.yml) — a
#     silent no-op would mean the behavioral layer looks live while nothing
#     is being scanned.

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: session-scan
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'Garl-Protocol/garl' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Run session scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SIGNING_PRIVATE_KEY_HEX: ${{ secrets.SIGNING_PRIVATE_KEY_HEX }}
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ] && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ -z "$SIGNING_PRIVATE_KEY_HEX" ] && missing="$missing SIGNING_PRIVATE_KEY_HEX"
          if [ -n "$missing" ]; then
            echo "::error::Session-scan secrets not configured:$missing — the daily scan DID NOT run. See docs/session-alerts.md"
            exit 1
          fi
          python scripts/session_scan.py
      - name: Alert on failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Daily session scan FAILED"
          body="The daily session-level behavioral scan failed — no agents were scanned for anomalies today.

          Run: $RUN_URL
          Docs: docs/session-alerts.md"
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --label session-scan-failure --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label session-scan-failure || \
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
