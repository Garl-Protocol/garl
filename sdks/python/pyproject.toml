[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garl-protocol"
version = "1.0.2"
description = "GARL Protocol Python SDK — Universal Trust Standard for AI Agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "GARL Protocol", email = "contact@garl.ai" }
]
dependencies = [
    "httpx>=0.24.0",
]
keywords = ["garl", "trust", "reputation", "ai", "agent", "a2a", "did", "ecdsa", "mcp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://garl.ai"
Documentation = "https://garl.ai/docs"
Repository = "https://github.com/Garl-Protocol/garl"
"API Reference" = "https://api.garl.ai/docs"

[tool.setuptools]
py-modules = ["garl"]
